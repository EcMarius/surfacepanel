version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: surfacepanel-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-surfacepanel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-surfacepanel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - surfacepanel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surfacepanel"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: surfacepanel-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Please set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - surfacepanel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: surfacepanel-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-surfacepanel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-surfacepanel}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Please set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Please set JWT_REFRESH_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?Please set SESSION_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    volumes:
      - ./logs:/var/log/surfacepanel
      - user_files:/var/surfacepanel/users
      - backups:/var/surfacepanel/backups
    networks:
      - surfacepanel-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: surfacepanel-frontend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost/api/v1}
    networks:
      - surfacepanel-network
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: surfacepanel-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ssl_certificates:/etc/nginx/ssl:ro
    networks:
      - surfacepanel-network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  user_files:
  backups:
  ssl_certificates:

networks:
  surfacepanel-network:
    driver: bridge
